name: readme-users

services:
  readme.users.mongo:
    image: mongo
    restart: always
    container_name: readme.users.mongo
    env_file:
      - user.env
    ports:
      - 27017:27017
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/readme-users --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  readme.users.mongo.ui:
    image: mongo-express
    restart: always
    container_name: readme.users.mongo.ui
    ports:
      - 8081:8081
    env_file:
      - user.env
    environment:
      ME_CONFIG_MONGODB_SERVER: readme.users.mongo
    depends_on:
      readme.users.mongo:
        condition: service_healthy

volumes:
  mongodb:
