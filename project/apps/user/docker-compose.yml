name: readme-users

services:
  readme.users.mongo:
    image: mongo
    restart: always
    container_name: readme.users.mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: test
      MONGO_INITDB_DATABASE: readme-users
    ports:
      - 27017:27017
    volumes:
      - mongodb:/data/db

  readme.users.mongo.ui:
    image: mongo-express
    restart: always
    container_name: readme.users.mongo.ui
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: test
      ME_CONFIG_MONGODB_URL: mongodb://admin:test@readme.users.mongo:27017/?authSource=admin

volumes:
  mongodb:
